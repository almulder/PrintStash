name: Fork Image (amd64)

# Fork-only fast path: backend lint + tests, then the all-in-one image for
# linux/amd64 only. The upstream release pipeline (ghcr.yml) stays untouched and
# is still used for anything headed upstream. Trigger with a `fork-v*` tag.

on:
  push:
    tags:
      - "fork-v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

concurrency:
  group: fork-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: uv sync --extra dev --extra full --frozen

      - name: Lint backend
        run: uv run ruff check app/ tests/

      # `fast` = unit + integration without the slow and container-backed subsets.
      # The full lane still runs through ghcr.yml before anything goes upstream.
      - name: Test backend
        run: ./scripts/test.sh fast

  image:
    name: Build and publish printstash (amd64)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=${REGISTRY}/${OWNER,,}/printstash" >> "$GITHUB_OUTPUT"

      - name: Build unified image
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: unified
          load: true
          set: |
            *.platform=linux/amd64
            unified.tags=${{ steps.name.outputs.image }}:candidate
            unified.labels.org.opencontainers.image.source=https://github.com/${{ github.repository }}
            unified.labels.org.opencontainers.image.revision=${{ github.sha }}
            *.cache-from=type=gha,scope=fork-printstash-amd64
            unified.cache-to=type=gha,scope=fork-printstash-amd64,mode=max,ignore-error=true

      - name: Smoke-test unified image
        run: bash backend/scripts/test-unified-image.sh "${{ steps.name.outputs.image }}:candidate"

      - name: Publish latest and tag
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ github.ref_name }}
        run: |
          docker tag "${IMAGE}:candidate" "${IMAGE}:latest"
          docker tag "${IMAGE}:candidate" "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${TAG}"
