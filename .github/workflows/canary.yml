name: GHCR Canary Images

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: ghcr-canary-main
  cancel-in-progress: true

jobs:
  guard:
    name: Require main
    runs-on: ubuntu-latest
    steps:
      - name: Check dispatch ref
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Canary images must be built from main"
            exit 1
          fi

  ci:
    needs: guard
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [guard, ci]
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/container-publish.yml
    with:
      canary: true
    secrets: inherit
